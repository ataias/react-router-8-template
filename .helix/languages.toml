# Same file types typos checks in `pnpm lint` - default language servers
# re-listed alongside typos since a `language-servers` override replaces rather
# than merges with Helix's built-in defaults.
[[language]]
name = "markdown"
language-servers = ["marksman", "rumdl", "typos"]
auto-format = true
formatter = { command = "bash", args = [
  "-c",
  'cd "%{workspace_directory}" && exec pnpm exec oxfmt --stdin-filepath=buffer.md',
] }


[[language]]
name = "bash"
language-servers = ["bash-language-server", "typos"]
auto-format = true
formatter = { command = "shfmt" }

[language-server.tsgo]
command = "pnpm"
args = ["exec", "tsc", "--lsp", "--stdio"]

[language-server.bash-language-server]
command = "pnpm"
args = ["exec", "bash-language-server", "start"]

[language-server.vscode-css-language-server]
command = "pnpm"
args = ["exec", "vscode-css-language-server", "--stdio"]
config = { css = { validate = true } }

[language-server.stylelint]
command = "pnpm"
args = ["exec", "stylelint-language-server", "--stdio"]
config = { stylelint = { validate = ["css"] } }

[language-server.vscode-json-language-server]
command = "pnpm"
args = ["exec", "vscode-json-language-server", "--stdio"]

[language-server.yaml-language-server]
command = "pnpm"
args = ["exec", "yaml-language-server", "--stdio"]

[language-server.typos]
command = "typos-lsp"

[language-server.oxlint]
command = "pnpm"
args = ["exec", "oxlint", "--lsp"]

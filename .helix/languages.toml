[[language]]
name = "tsx"
language-servers = ["tsgo", "oxlint", "typos"]
auto-format = true
formatter = { command = "bash", args = [
  "-c",
  'cd "%{workspace_directory}" && exec pnpm exec oxfmt --stdin-filepath=buffer.tsx',
] }

